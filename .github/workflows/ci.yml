name: ci

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install -e .[dev,train]
      - name: Lint
        run: ruff check .
      - name: Type Check
        run: mypy services evaluation observability
      - name: Tests
        run: pytest
      - name: Build training image
        run: docker build -f infra/docker/Dockerfile.training -t llm-training .
      - name: Build serving image
        run: docker build -f infra/docker/Dockerfile.serving -t llm-serving .
      - name: Validate minimal training step
        run: python -m services.training.pretrain.train
      - name: Validate inference endpoint
        run: python -c "from fastapi.testclient import TestClient; from services.serving.api.app import app; c=TestClient(app); assert c.get('/health').status_code==200"
