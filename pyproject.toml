[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-stack"
version = "0.1.0"
description = "Modular production-grade LLM stack optimized for 8GB GPUs"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
train = [
  "datasets>=2.18",
  "transformers>=4.40",
  "peft>=0.10",
  "trl>=0.8",
  "accelerate>=0.30",
  "mlflow>=2.12",
]
serve = ["vllm>=0.5"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.4",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["services*", "evaluation*", "observability*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
