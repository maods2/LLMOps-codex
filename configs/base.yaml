run_name: baseline-8gb
seed: 42
device: cuda

data:
  sources: [wikitext2, tinystories, local_jsonl]
  max_samples: 20000
  seq_len: 512
  cache_dir: ./artifacts/cache
  split: [0.9, 0.05, 0.05]

model:
  vocab_size: 32000
  n_layers: 12
  hidden_size: 1024
  n_heads: 8
  context_length: 512
  dropout: 0.0

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  warmup_steps: 50
  max_steps: 200
  precision: fp16
  grad_checkpoint: true
  checkpoint_dir: ./artifacts/checkpoints

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

dpo:
  beta: 0.1
  max_prompt_tokens: 256
  max_response_tokens: 256
